# Alembic configuration.
#
# NOTE: keep this file ASCII-only. Alembic reads it with the system locale
# encoding (GBK on Chinese Windows), so non-ASCII characters would break it.
#
# Common commands (run from project root):
#   .\.venv\Scripts\python.exe -m alembic upgrade head
#   .\.venv\Scripts\python.exe -m alembic downgrade -1
#   .\.venv\Scripts\python.exe -m alembic current
#   .\.venv\Scripts\python.exe -m alembic revision --autogenerate -m "message"
#
# The database URL is NOT stored here. migrations/env.py loads it from
# app.core.config.settings.database_url (.env), so passwords stay out of git.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
timezone = Asia/Shanghai
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
